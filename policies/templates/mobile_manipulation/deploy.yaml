# PolicySpace deployment config: local hold-position stand-in for the
# Quanta X1 whole-body mobile boards, mirroring example_policy's role on the
# desktop contract.
#
# Speaks the public Quanta X1 whole-body policy wire, so it exercises the
# whole mobile launch path (board -> suite -> policy-wire decode -> 21D env
# action) without OpenPI, a native gateway, or any GPU. It commands no motion,
# so it is a plumbing smoke, not a success-rate run.
#
#   policy-space serve policies/templates/mobile_manipulation/deploy.yaml \
#     --host 127.0.0.1 --port 8001
policy_name: example_mobile_policy

model:
  class: Model
  cfg:
    action_horizon: 32

metadata:
  supported_schema_pairs:
    - observation_schema: mobile_bimanual_rgb@1
      action_schema: mobile_semantic_20d@1
      embodiment_constraints: [ex001_mobile@1]
  wire_schema: manaenv_ex001_wholebody_policy_wire_20d_v1
  embodiment: Quanta X1
  action_mode: ik_eef_abs_wholebody
  action_dim: 20
  base_representation: vx_vy_yaw_rate
  ee_rotation_representation: euler_xyz
  ee_reference: init_ee_pose
  action_horizon: 32
  gripper_convention: normalized_01

server:
  host: "0.0.0.0"
  port: 8001
  session_mode: multiplexed_serial
