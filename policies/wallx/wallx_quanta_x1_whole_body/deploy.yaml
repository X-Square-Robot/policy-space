# WallX Quanta X1 whole-body -> X2Real public policy wire gateway.
policy_name: wallx_ex001_wholebody

model:
  class: Model
  cfg:
    native_address: "127.0.0.1"
    native_port: 8002
    timeout_seconds: 180
    jpeg_quality: 95
    instruction: ""

server:
  host: "0.0.0.0"
  port: 8001
  session_mode: multiplexed_serial

metadata:
  supported_schema_pairs:
    - observation_schema: mobile_bimanual_rgb@1
      action_schema: mobile_semantic_20d@1
      embodiment_constraints: [ex001_mobile@1]
  wire_schema: manaenv_ex001_wholebody_policy_wire_20d_v1
  action_dim: 20
  base_representation: vx_vy_yaw_rate
  ee_rotation_representation: euler_xyz
  ee_reference: init_ee_pose
  action_horizon: 32
  gripper_convention: normalized_01
