# Policy Space deployment config: OpenPI π0.5 ArtiXon Arm-6A desktop EE pose
#
# Run with the Python interpreter from OpenPI's environment and set
# OPENPI_ROOT to its source checkout.
# Keep the established wire identity so existing ManaEnv configurations and
# running evaluation services remain compatible after the directory rename.
policy_name: openpi_x2robot

model:
  module: policy_space.openpi_x2robot.model
  class: Model
  cfg:
    # Required unless OPENPI_ROOT is set.
    openpi_root: ""
    # OPENPI_CHECKPOINT_PATH is required unless this field is overridden.
    checkpoint_path: ""
    # If the source checkout does not yet contain this training-only config,
    # the adapter uses the inference-equivalent pi05_ex001_6r_joint_finetune.
    train_config: pi05_x2real_lerobotv2_finetune
    device: cuda:0
    # Eager mode avoids multi-minute first-request Triton autotuning and keeps
    # compiler caches off shared filesystems. Set an OpenPI-supported mode
    # explicitly only when the serving host has a suitable node-local compile
    # cache.
    pytorch_compile_mode: null
    # The default X2Real checkpoint stores the first two rotation rows.
    # Use "column" only for checkpoints trained with the standard column form.
    rotation_layout: row
    action_horizon: 32
    require_instruction: true
    instruction: ""
    camera_map:
      camera_front: cam_high
      camera_left: cam_left_wrist
      camera_right: cam_right_wrist
    state_fields: [follow1_pos, follow2_pos]

server:
  host: "0.0.0.0"
  port: 8001
  session_mode: multiplexed_serial

metadata:
  supported_schema_pairs:
    - observation_schema: bimanual_rgb_ee@1
      action_schema: bimanual_ee_absolute@1
      embodiment_constraints: [ex001_6r@1]
  protocol: policy_space
  embodiment: ArtiXon Arm-6A
  action_dim: 14
  gripper_convention: normalized_01
  # Website-facing simulator control mode. The 14-D init-relative Euler wire
  # is converted client-side into the 16-D absolute IK action.
  action_mode: ik_eef_abs
  # One current-state echo followed by the model's 32 predicted actions.
  action_horizon: 33
  action_space: x2_bimanual_ee_init_relative
  state_space: x2_bimanual_ee_init_relative
  model_action_dim: 20
  model_rotation: rot6d_row
  wire_pose_reference: init_ee_pose
  rotation: euler_xyz
