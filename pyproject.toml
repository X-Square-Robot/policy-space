[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-space"
version = "0.3.0"
description = "A benchmark-neutral runtime for robot policy integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "msgpack>=1.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "websockets>=12",
]

[project.optional-dependencies]
test = [
    "msgpack-numpy>=0.4.8",
    "opencv-python-headless>=4.8",
    "pytest>=8",
    "scipy>=1.10",
]

[project.scripts]
policy-space = "policy_space.cli:main"

[tool.setuptools.packages.find]
where = ["src", "packages/protocol/src"]

[tool.setuptools.package-data]
"policy_space_protocol.contracts" = ["schemas/*/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src", "packages/protocol/src", "."]
testpaths = ["tests"]
addopts = "-ra"
